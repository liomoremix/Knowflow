# deploy/monitoring/grafana/provisioning/datasources/datasource.yml
#
# 开机自动挂好 Prometheus 数据源，省去手工在 UI 里配。
# uid 固定为 prometheus：看板 JSON 里直接引用它，重建 Grafana 容器也不会失联。

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
