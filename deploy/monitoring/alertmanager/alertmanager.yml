# deploy/monitoring/alertmanager/alertmanager.yml
#
# 告警路由与通知。只配一个 webhook 接收端：钉钉/飞书/企业微信的机器人都不接受
# Alertmanager 的原生 webhook body（各自的签名与消息格式不同），生产上通常在中间放一个
# 转发网关（如 prometheus-webhook-dingtalk），把这里的 url 指到网关即可，本文件不用改。
#
# url 用 ${ALERT_WEBHOOK_URL} 由 compose 注入（Alertmanager 会对配置文件做环境变量展开）。

global:
  resolve_timeout: 5m

route:
  receiver: default
  # 按 alertname 聚合：同一个告警在多个实例上触发时只发一条通知，避免刷屏
  group_by: ["alertname", "severity"]
  group_wait: 30s        # 首次告警等 30s，把同时触发的一批合并成一条
  group_interval: 5m     # 同一组有新告警时的最小间隔
  repeat_interval: 4h    # 未恢复的告警每 4 小时重发一次
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h  # 严重告警催得更勤

receivers:
  - name: default
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true   # 恢复时也发一条，否则值班的人不知道问题好没好
  - name: critical
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true

inhibit_rules:
  # 有目标掉线时，抑制所有 warning 级告警。
  # 理由：服务/Milvus 挂了之后，延迟高、失败率高、慢查询暴涨全都是同一个根因的派生现象，
  # 一起发出来只会淹没真正要看的那条 critical。
  # equal 留空是故意的：派生告警（QueryP99High 等）在 PromQL 里做了 sum by(le) 聚合，
  # 身上已经没有 job 标签，按 job 匹配根本匹配不上。
  - source_matchers:
      - alertname="TargetDown"
    target_matchers:
      - severity="warning"
    equal: []
