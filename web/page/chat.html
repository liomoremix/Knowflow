<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库问答</title>
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --border:#e3e8ef;
    --text:#1f2937; --text-2:#6b7280; --text-3:#9aa3af;
    --accent:#2b9bf4; --accent-deep:#1e7fd6;
    --ok:#16a34a; --err:#dc2626;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.65;
    display:flex; flex-direction:column;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* 顶栏 */
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:12px 20px; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent)}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:.2px}
  .brand p{font-size:12px;color:var(--text-2)}
  .topbar-actions{display:flex;align-items:center;gap:14px}
  .stream-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);user-select:none}
  .stream-toggle input{width:15px;height:15px;accent-color:var(--accent)}
  .pill{
    font-size:12px;color:var(--text-2);background:var(--bg);
    border:1px solid var(--border);border-radius:999px;padding:5px 12px;white-space:nowrap;
  }
  .pill.on{color:var(--ok);border-color:#bbe5c8;background:#f0faf3}
  .btn{border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500;transition:background .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}

  /* 消息区 */
  .chat{flex:1 1 auto;overflow-y:auto;padding:24px 20px 12px;display:flex;flex-direction:column;gap:18px}
  .msg{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
  .msg.user{flex-direction:row-reverse}
  .avatar{
    flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:#eef1f5;color:var(--text-2);
    display:flex;align-items:center;justify-content:center;font-size:13px;align-self:flex-start;
  }
  .msg.user .bubble{
    background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;
    white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);
  }
  .msg.ai .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:var(--shadow);width:100%;
  }
  .answer{white-space:pre-wrap;word-break:break-word}
  .answer:empty::after{content:"思考中…";color:var(--text-3)}

  /* 处理进度折叠面板 */
  details.progress{margin-bottom:12px;border:1px dashed var(--border);border-radius:8px;background:#fafbfc}
  details.progress summary{
    cursor:pointer;list-style:none;padding:7px 12px;font-size:12.5px;color:var(--text-2);
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  details.progress summary::-webkit-details-marker{display:none}
  details.progress summary::before{content:"▸";transition:transform .15s;display:inline-block}
  details.progress[open] summary::before{transform:rotate(90deg)}
  details.progress ul{list-style:none;padding:2px 12px 10px;display:flex;flex-direction:column;gap:3px}
  details.progress li{font-size:12.5px;color:var(--text-2)}
  details.progress li.run::before{content:"● ";color:var(--accent)}
  details.progress li.done::before{content:"✓ ";color:var(--ok)}

  /* 图片 */
  .images{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .images figure{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  .images img{display:block;max-width:100%;max-height:420px;object-fit:contain;background:#fdfdfd}
  .images figcaption{
    font-size:11.5px;color:var(--text-3);padding:6px 10px;border-top:1px solid var(--border);
    word-break:break-all;
  }
  .err-text{color:var(--err);font-size:13.5px;margin-top:8px}

  /* 输入区 */
  .composer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px 10px}
  .composer-row{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:stretch}
  textarea{
    flex:1;resize:none;border:1px solid var(--border);border-radius:10px;background:#fbfcfd;
    padding:11px 14px;font:inherit;color:var(--text);min-height:52px;max-height:160px;
  }
  textarea:focus{outline:none;border-color:var(--accent);background:#fff}
  .composer .btn-primary{align-self:flex-end;min-width:84px;padding:12px 20px}
  .hints{max-width:860px;margin:8px auto 0;font-size:12px;color:var(--text-3)}
  kbd{
    font-family:inherit;font-size:11px;background:var(--bg);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-2);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>知识库问答</h1>
      <p>在线 · 可查询知识库与联网信息</p>
    </div>
  </div>
  <div class="topbar-actions">
    <label class="stream-toggle"><input type="checkbox" id="streamToggle" checked>流式输出</label>
    <span class="pill" id="apiPill">API: 未连接</span>
    <button class="btn btn-primary" id="clearBtn">清空对话</button>
  </div>
</header>

<main class="chat" id="chat" aria-live="polite"></main>

<footer class="composer">
  <div class="composer-row">
    <textarea id="input" rows="1" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="btn btn-primary" id="sendBtn">发送</button>
  </div>
  <div class="hints">快捷键: <kbd>Enter</kbd> 发送, <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</div>
</footer>

<script>
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");
  var streamToggle = document.getElementById("streamToggle");
  var apiPill = document.getElementById("apiPill");

  // 会话标识:载入时读取或生成,持久化到 localStorage
  var sessionId = localStorage.getItem("zgtk_session_id");
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    localStorage.setItem("zgtk_session_id", sessionId);
  }

  var eventSource = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

  function addUserBubble(text) {
    var wrap = document.createElement("div");
    wrap.className = "msg user";
    wrap.innerHTML = '<div class="bubble">' + esc(text) + '</div><div class="avatar">我</div>';
    chat.appendChild(wrap);
    scrollBottom();
  }

  // 创建助手卡片,返回其内部引用以便增量更新
  function addAiCard() {
    var wrap = document.createElement("div");
    wrap.className = "msg ai";
    wrap.innerHTML =
      '<div class="card">' +
        '<details class="progress"><summary>处理进度</summary><ul></ul></details>' +
        '<div class="answer"></div>' +
        '<div class="images"></div>' +
      '</div>';
    chat.appendChild(wrap);
    scrollBottom();
    return {
      root: wrap,
      progressList: wrap.querySelector(".progress ul"),
      progressBox: wrap.querySelector(".progress"),
      answer: wrap.querySelector(".answer"),
      images: wrap.querySelector(".images")
    };
  }

  function renderProgress(card, doneList, runningList) {
    var html = "";
    (runningList || []).forEach(function (n) { html += '<li class="run">' + esc(n) + " 正在进行...</li>"; });
    (doneList || []).forEach(function (n) { html += '<li class="done">' + esc(n) + " 已完成</li>"; });
    card.progressList.innerHTML = html;
    if (html) { card.progressBox.open = true; }
  }

  function renderImages(card, urls) {
    if (!urls || !urls.length) return;
    card.images.innerHTML = urls.map(function (u) {
      return '<figure><img src="' + esc(u) + '" alt="参考图片" loading="lazy"><figcaption>' + esc(u) + "</figcaption></figure>";
    }).join("");
  }

  function showError(card, msg) {
    var d = document.createElement("div");
    d.className = "err-text";
    d.textContent = "出错了: " + msg;
    card.root.querySelector(".card").appendChild(d);
    scrollBottom();
  }

  function closeStream() {
    if (eventSource) { eventSource.close(); eventSource = null; }
    sendBtn.disabled = false;
  }

  function openStream(card) {
    closeStream();
    eventSource = new EventSource("/stream/" + encodeURIComponent(sessionId));
    eventSource.addEventListener("ready", function () { /* 握手成功,无需处理 */ });
    eventSource.addEventListener("progress", function (e) {
      var d = JSON.parse(e.data);
      renderProgress(card, d.done_list, d.running_list);
    });
    eventSource.addEventListener("delta", function (e) {
      var d = JSON.parse(e.data);
      // 兼容 doc20 的 delta 键与 doc19 的 text 键
      var piece = d.delta != null ? d.delta : d.text;
      if (piece) { card.answer.textContent += piece; scrollBottom(); }
    });
    eventSource.addEventListener("final", function (e) {
      var d = JSON.parse(e.data);
      if (d.answer) card.answer.textContent = d.answer;
      renderImages(card, d.image_urls);
      closeStream();
    });
    eventSource.addEventListener("error", function (e) {
      // SSE 通道错误 vs 业务 error 事件:业务事件带 data
      if (e && e.data) {
        showError(card, JSON.parse(e.data).error || "未知错误");
        closeStream();
      } else if (eventSource && eventSource.readyState === EventSource.CLOSED) {
        closeStream();
      }
    });
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    var isStream = streamToggle.checked;

    addUserBubble(text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    var card = addAiCard();

    fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text, session_id: sessionId, is_stream: isStream })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (isStream) {
          openStream(card);
        } else {
          if (res.answer) card.answer.textContent = res.answer;
          closeStream();
        }
      })
      .catch(function (err) {
        showError(card, err.message || "请求失败");
        closeStream();
      });
  }

  function loadHistory() {
    fetch("/history/" + encodeURIComponent(sessionId) + "?limit=50")
      .then(function (r) { return r.json(); })
      .then(function (res) {
        (res.items || []).forEach(function (it) {
          if (it.role === "user") addUserBubble(it.text);
          else if (it.role === "assistant") {
            var card = addAiCard();
            card.progressBox.remove();
            card.answer.textContent = it.text || "";
          }
        });
      })
      .catch(function () { /* 历史加载失败不影响使用 */ });
  }

  function checkHealth() {
    fetch("/health")
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) { apiPill.textContent = "API: 已连接"; apiPill.classList.add("on"); }
      })
      .catch(function () { apiPill.textContent = "API: 未连接"; apiPill.classList.remove("on"); });
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  clearBtn.addEventListener("click", function () {
    fetch("/history/" + encodeURIComponent(sessionId), { method: "DELETE" })
      .catch(function () {})
      .then(function () { closeStream(); chat.innerHTML = ""; });
  });

  checkHealth();
  loadHistory();
})();
</script>
</body>
</html>
