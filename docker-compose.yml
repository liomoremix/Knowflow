include:
  - path: deploy/milvus/docker-compose.yml
  # 监控栈（Prometheus + Alertmanager + Grafana）。整块可摘：删掉这一行即下线，业务无感知
  - path: deploy/monitoring/docker-compose.monitoring.yml

x-app-common: &app-common
  build:
    context: .
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      TORCH_SPEC: ${TORCH_SPEC:-torch==2.14.0+cpu}
      TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
  env_file:
    - .env
  environment:
    # 容器内互访用服务名，覆盖 .env 里的 localhost / Windows 路径
    MILVUS_URL: http://standalone:19530
    MONGO_URL: mongodb://mongo:27017
    # 该值同时被用于「容器连 MinIO」和「浏览器加载图片」；跨机访问请在 .env 里加
    # APP_MINIO_ENDPOINT=<宿主机局域网IP>:9010（变量名故意与 app 用的 MINIO_ENDPOINT 不同：
    # compose 会拿根目录 .env 做 ${} 插值，同名会被 .env 里的 localhost 值顶掉）
    MINIO_ENDPOINT: ${APP_MINIO_ENDPOINT:-host.docker.internal:9010}
    DATA_BASED_ROOT_DIR: /data/uploads
    BGE_M3_PATH: /models/bge-m3
    # 固定 CPU；GPU 由 docker-compose.gpu.yml 覆盖
    BGE_DEVICE: cpu
    BGE_FP16: "False"
    MODELSCOPE_CACHE: /models
    HF_HOME: /models/hf
    MODELSCOPE_OFFLINE: "1"
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ${BGE_M3_DIR:-./models/BAAI/bge-m3}:/models/bge-m3:ro
    - uploads:/data/uploads
    # 评测结果目录：巡检容器写线上评测结果，两个 API 的 /metrics 读它算 kb_eval_recall，
    # 必须共享同一份，否则各自只看得见自己进程写的那些
    - eval_results:/app/eval/results
  restart: unless-stopped
  depends_on:
    standalone:
      condition: service_healthy
    mongo:
      condition: service_healthy
    app-minio:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - app_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  import-api:
    <<: *app-common
    command: uvicorn web.api.import_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  query-api:
    <<: *app-common
    command: uvicorn web.api.query_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 索引巡检（P5）：每 SCHEDULER_INTERVAL_HOURS 小时跑一轮——线上抽样评测 + 采集索引/延迟
  # 信号 + 判定是否该重建。默认只出结论（SCHEDULER_AUTO_REBUILD=false），开了也只做
  # prepare-only 重建，切别名始终要人确认。不加载 BGE-M3，内存占用远小于两个 API
  scheduler:
    <<: *app-common
    command: python -m processor.index_manager.scheduler --loop
    restart: unless-stopped

volumes:
  mongo_data:
  app_minio_data:
  uploads:
  eval_results:
